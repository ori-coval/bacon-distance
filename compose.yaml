services:
  db:
    image: mysql:8.0
    container_name: bacon-distance-mysql
    ports:
      - 3306:3306
    restart: always
    environment:
      MYSQL_DATABASE: bacon_distance
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-bacon-vol:/var/lib/mysql

  backend:
    build:
      context: ./bacon_distance/
      target: backend
    container_name: bacon-distance-backend
    ports:
      - 8000:80
    restart: "always"

  frontend:
    build:
      context: ./frontend/
      target: frontend
    container_name: bacon-distance-frontend
    ports:
      - 80:80
    restart: "always"

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

  new-movie-queue:
    build:
      context: ./db_updator_queue/
      target: update_queue
    container_name: bacon-distance-update-queue
    restart: "always"

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  mysql-bacon-vol:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
